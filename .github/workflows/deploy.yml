name: Prix & déploiement

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 1 * * *" # chaque nuit, après la mise à jour des prix Cardmarket de TCGdex (~23h UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger cartes et prix (TCGdex)
        run: node scripts/build-data.mjs
      - name: Enregistrer l'historique hebdomadaire des prix
        run: |
          git add public/data/history
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Historique des prix $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
